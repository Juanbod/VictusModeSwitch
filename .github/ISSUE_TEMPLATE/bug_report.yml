name: Bug report
description: Report a reproducible problem on supported hardware
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: I am using system board 8A4F with Thermal Policy V0.
          required: true
  - type: input
    attributes:
      label: App version
      placeholder: 2.0.0
    validations:
      required: true
  - type: input
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Include the steps, expected result, and actual result. Remove personal information from logs before attaching them.
    validations:
      required: true
