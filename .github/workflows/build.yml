name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore .\VictusModeSwitch.slnx
      - name: Test Windows PowerShell uninstall recovery
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-UninstallRecovery.ps1
      - name: Test
        run: dotnet test .\VictusModeSwitch.slnx -c Release --no-restore
      - name: Publish smoke test
        run: >-
          dotnet publish .\src\VictusModeSwitch\VictusModeSwitch.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishReadyToRun=false
          -p:DebugType=embedded
          -o .\artifacts\publish
